name: Build SUPER MANH Shop

# Builds switch/SuperManhShop/supermanhshop.nro.
#   - Every push: zip available under Actions > the run > Artifacts.
#   - Push a tag equal to APP_VERSION in the Makefile (e.g. 1.5.1, no "v"):
#     also published as a GitHub Release. The app's update check compares the
#     latest release tag with its own version, so they must match exactly.
# Shop address baked into the app: repository variable SMSS_SHOP_URL
# (Settings > Secrets and variables > Actions > Variables), default below.

on:
  push:
    branches: [ main, master, supermanh ]
    tags: [ '*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Make sure Plutonium (UI library) is present
        shell: bash
        run: |
          set -euo pipefail
          # Uploading the source through the GitHub web page drops the submodule link.
          if [ ! -f include/Plutonium/Plutonium/Makefile ]; then
            rm -rf include/Plutonium
            git clone https://github.com/luketanti/Plutonium.git include/Plutonium
            git -C include/Plutonium checkout f42b88857aeb4f3080bea18016366cbda6546300
          fi

      - name: Build
        shell: bash
        env:
          SMSS_SHOP_URL: ${{ vars.SMSS_SHOP_URL || 'https://supermanh.com/tinfoil' }}
          SMSS_SHOP_TITLE: ${{ vars.SMSS_SHOP_TITLE || 'SUPER MANH Shop' }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dkp-pacman -S --noconfirm --needed switch-ntfs-3g switch-lwext4
          # No closed HAUTH/UAUTH blob in this build: the shop identifies consoles by UID.
          make -j"$(nproc)" RELEASE=1 \
            SMSS_SHOP_URL="$SMSS_SHOP_URL" \
            SMSS_SHOP_TITLE="$SMSS_SHOP_TITLE" \
            SMSS_UPDATE_REPO="${GITHUB_REPOSITORY}"
          test -f ./supermanhshop.nro
          ls -l ./supermanhshop.nro

      - name: Package SuperManhShop.zip (extract to SD root)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist SuperManhShop.zip
          mkdir -p dist/switch/SuperManhShop/theme
          cp -v ./supermanhshop.nro dist/switch/SuperManhShop/supermanhshop.nro
          cp -v ./examples/theme/supermanh.json dist/switch/SuperManhShop/theme/theme.json
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile("SuperManhShop.zip", "w", compression=zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk("dist/switch"):
                  for f in files:
                      full = os.path.join(root, f)
                      z.write(full, full[len("dist/"):])
          print("\n".join(zipfile.ZipFile("SuperManhShop.zip").namelist()))
          PY

      - name: Build NSP kit (exefs + romfs + control, packed later with your own keys)
        shell: bash
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^APP_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | head -1 | tr -d '[:space:]')
          K=dist_nsp/kit
          rm -rf dist_nsp && mkdir -p $K/exefs $K/control
          elf2nso ./supermanhshop.elf $K/exefs/main
          npdmtool nsp/supermanh.npdm.json $K/exefs/main.npdm
          cp -r romfs $K/romfs
          nacptool --create "SUPER MANH Shop" "supermanh.com" "$VER" $K/control/control.nacp --titleid=0x05004d414e480000
          cp romfs/images/icon.jpg $K/control/icon_AmericanEnglish.dat
          cp nsp/DONG_GOI_NSP.bat nsp/dong_goi_nsp.ps1 dist_nsp/
          ls -lR dist_nsp | head -40

      - name: Check the kit with hacBrewPack (fake keys, structure only)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq build-essential >/dev/null || true
          git clone --depth 1 https://github.com/The-4n/hacBrewPack.git /tmp/hbp
          cp /tmp/hbp/config.mk.template /tmp/hbp/config.mk 2>/dev/null || true
          make -C /tmp/hbp >/dev/null
          python3 - <<'PY'
          import os
          r=lambda: os.urandom(16).hex()
          lines=["header_key = "+os.urandom(32).hex()]+[f"key_area_key_application_{i:02x} = {r()}" for i in range(0x20)]
          open("/tmp/fake.keys","w").write("\n".join(lines)+"\n")
          PY
          cd dist_nsp
          /tmp/hbp/hacbrewpack -k /tmp/fake.keys --titleid 05004d414e480000 --exefsdir kit/exefs --romfsdir kit/romfs --controldir kit/control --nspdir /tmp/nsp_test || true
          ls -l /tmp/nsp_test || true
          rm -rf hacbrewpack_temp hacbrewpack_nca hacbrewpack_backup

      - name: Bundle everything (plugin + app + NSP kit + guide)
        shell: bash
        run: |
          set -euo pipefail
          B=bundle/SuperManh_TronBo
          rm -rf bundle && mkdir -p "$B/1_Plugin_WordPress" "$B/2_App_Switch_NRO" "$B/3_Dong_goi_NSP"
          (cd wordpress-plugin && python3 -c "import shutil; shutil.make_archive('../$B/1_Plugin_WordPress/supermanh-switch-shop','zip','.','supermanh-switch-shop')")
          cp -r dist/switch "$B/2_App_Switch_NRO/"
          cp -r dist_nsp/* "$B/3_Dong_goi_NSP/"
          cp nsp/HUONG_DAN_CAI_DAT.md "$B/"
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile("SuperManh_TronBo.zip","w",zipfile.ZIP_DEFLATED) as z:
              for root,_,files in os.walk("bundle"):
                  for f in files:
                      full=os.path.join(root,f); z.write(full, full[len("bundle/"):])
          n=zipfile.ZipFile("SuperManh_TronBo.zip").namelist()
          print(len(n),"files"); print("\n".join([x for x in n if "/romfs/" not in x]))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperManhShop
          path: |
            SuperManhShop.zip
            SuperManh_TronBo.zip
          if-no-files-found: error

      - name: Read app version
        id: ver
        shell: bash
        run: echo "version=$(sed -n 's/^APP_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | head -1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # A push to main publishes (or refreshes) the release named after APP_VERSION,
      # so the in-app update check (latest release tag == app version) stays correct.
      # Bump APP_VERSION in the Makefile to ship a new version to customers.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SUPER MANH Shop ${{ steps.ver.outputs.version }}
          files: |
            SuperManh_TronBo.zip
            SuperManhShop.zip
          make_latest: true
          body: |
            SuperManh_TronBo.zip: plugin WordPress + app Switch (NRO) + bộ đóng gói NSP + hướng dẫn. Đọc HUONG_DAN_CAI_DAT.md trong đó.
            SuperManhShop.zip: chỉ app NRO, giải nén vào gốc thẻ nhớ.
            Dựa trên CyberFoil (GPL-3.0) của luketanti.
